project_id = "blup"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "blup://"
additional_redirect_urls = [
  "blup://auth/callback",
  "blup://auth/reset-password",
  "http://localhost:8081",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# OAuth providers — fill the ids/secrets in supabase/.env (never commit them).
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
# Webhooks are called by Stripe/Apple, which cannot present a Supabase JWT, so
# they authenticate by signature instead. Everything else requires a session.
[functions.stripe-webhook]
verify_jwt = false

[functions.iap-apple-notifications]
verify_jwt = false

[functions.config-status]
verify_jwt = false

[functions.checkout-create]
verify_jwt = true

[functions.organizer-connect]
verify_jwt = true

[functions.payout-request]
verify_jwt = true

[functions.iap-apple-verify]
verify_jwt = true

[functions.ai-recommendations]
verify_jwt = true

[functions.push-dispatch]
verify_jwt = false
